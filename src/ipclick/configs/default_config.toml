# ================ SDK配置 [CLIENT] ================
# -------------- 基础配置 [GENERAL] --------------
[GENERAL]
# 客户端运行模式，供 ipclick.create_client() 使用：
#   standalone 连单个 [SERVER].host:port（默认）
#   cluster    用 [CLUSTER] 的节点池、负载均衡与故障转移
#   auto       配了节点就走集群，没配就单机
# 注意：mode = "cluster" 却没配任何节点会直接报错，不会静默退回单机——
# 那会让你以为集群生效了，实际所有流量都打在一个节点上、也没有故障转移。
mode = "standalone"
# 调试模式 (开启后强制 DEBUG 级别日志，覆盖 [LOG].level)
debug = false

# ------- 客户端配置 [CLIENT] -------
# 客户端到服务端这一跳的重试。适配器内部的重试解决的是"目标站点抖了"，
# 这里解决的是"我们自己的服务端抖了"，两者互不覆盖。
[CLIENT]
# 最多重试几次（0 = 不重试）
rpc_max_retries = 2
# 退避基数（秒），实际等待 = 基数 * 2^已重试次数
rpc_retry_backoff = 0.5
# 说明：只有 UNAVAILABLE（连接压根没建起来、请求没到过服务端）才会重试。
# DEADLINE_EXCEEDED 刻意不重试——请求可能已经在服务端执行了，只是回复没赶上，
# 这时重发一个 POST 就是重复下单。

# 请求压缩（gRPC 消息级 gzip，服务端透明解压，无需协议改动）。
#   auto  够大且看起来可压缩才压（默认）
#   gzip  一律压。链路带宽紧、CPU 富余时用
#   none  一律不压。同机通信、或链路上已有压缩时用
# 主要收益在自动化脚本上：automation_script 传的是整个脚本文件，
# 实测 8158 字节压到 350 字节。批量发几百个带脚本的请求时差出一个数量级。
compression = "auto"
# auto 的体积门槛（字节）。一个普通 GET 请求约 200~400 字节，压它省不下什么。
# 另外：请求体主要是已压缩的二进制（图片、gzip 包）时会自动跳过——
# 再压一遍只会变大还费 CPU。
compression_threshold = 1024

# ------- 代理配置 [PROXY] -------
# 供 downloader.get(url, proxy=True) 使用。默认留空表示"未配置代理"，
# 此时 proxy=True 会打一条警告并直连——不要在这里预置某台机器的本地代理地址，
# 否则所有用户的 proxy=True 都会指向他们自己的 127.0.0.1:7890（可能是别的服务）。
[PROXY]
scheme = 'http'
host = ''
port = 0
# 账号密码是机密，不放这里 —— 用环境变量 / .env：
#   IPCLICK_PROXY_AUTH_KEY / IPCLICK_PROXY_AUTH_PASSWORD
# 三方隧道代理
channel_name = ''
session_ttl = ''
country_code = ''
tunnel_server = ''

# ------- 集群配置 [CLUSTER] -------
# 有两种集群形态，用 forward 选：
#
#   forward = "off"（默认）客户端分发。调用方（ClusterDownloader）自己持有全部
#     节点地址，直连每一台。少一跳、不占入口带宽，前提是调用方能连到所有节点。
#
#   forward = "on"  服务端转发。调用方只需要知道一个地址，比如 A。A 按策略挑节点：
#     挑到自己就本地干，挑到别人就把请求原样转过去，拿到结果再回给调用方。
#     不需要 Redis 之类的中间件——任务从哪进来，分发和限流就在那一台算。
#
# 服务端转发的三条性质，配之前值得知道：
#   1. 只转一跳。转发时带 ipclick-forwarded 标记，收到带标记的请求一律本地执行，
#      所以环路在协议层就不可能出现。
#   2. 任意节点都能当入口。五台机器可以用**完全相同**的这份配置 + 相同的 .env，
#      谁被访问谁就是入口；平时只把流量打给 A，A 挂了直接改指向 B 即可。
#   3. 入口自己也干活（只要它在下面的 nodes 里）。子节点全挂时入口会自己兜底，
#      而不是让请求失败。
#   4. 流式下载（stream=True）不转发，永远由收到请求的节点自己执行——把每个分片
#      再中转一次会让入口带宽翻倍。要让子节点出流量就用客户端分发模式直连它。
[CLUSTER]
forward = "off"
# 本节点在下面 nodes 列表里的 id。留空则按 [SERVER] 的监听端口 + 本机地址自动识别；
# 识别不出来会打警告，且本节点只转发不执行任务。
# 多台机器共用一份配置时，用环境变量区分更省事：IPCLICK_CLUSTER_SELF_ID
self_id = ""
# 转发一次请求的超时（秒）。0 = 按任务自身的 timeout × (重试次数+1) + 15s 余量推算。
forward_timeout = 0
# 集群内部鉴权：所有节点放同一个共享密钥，每个节点的令牌由它派生：
#     token = HMAC-SHA256(secret, "ipclick-node:" + node_id)
# 于是每台机器的令牌**各不相同**（拿到 B 的令牌不能调 C），但谁都不用抄谁的令牌，
# 加机器也不用发新凭据。密钥是机密，请放 .env：IPCLICK_CLUSTER_SECRET
# 也可以在某个 nodes 条目里写 token = "..." 单独指定，那会覆盖派生值。
# secret = ""   # ← 别写在这里，写了启动时会告警

# 负载均衡策略：round_robin / random / weight
load_balancer = "round_robin"
# 连续探测失败多少次才摘除节点（避免一次抖动就让流量反复横跳）
failure_threshold = 2
# 连续探测成功多少次才把节点加回来
recovery_threshold = 2
# 探活间隔与单次超时（秒）。探活走 grpc.health.v1，免鉴权。
probe_interval = 10
probe_timeout = 3
# 一次请求最多换几个节点重试
max_failover = 2
# 节点列表。address 必填，其余可选。
# forward = "on" 时这份列表就是集群全貌，包括本机自己——本机也要列进来才会分到活。
nodes = [
    # { id = "node-101", address = "192.168.1.101:9527", region = "us-east-1", zone = "1a", weight = 100 },
    # { id = "node-102", address = "192.168.1.102:9527" },
    # 这台的令牌不由共享密钥管（比如是别人维护的节点）：
    # { id = "node-103", address = "192.168.1.103:9527", token = "..." },
]

# ------- 节点发现 [CLUSTER.discovery] -------
# 节点列表从哪来：
#   static  上面的 nodes（默认）。扩缩容要改配置重启客户端。
#   dns     解析一个域名，每条 A/AAAA 记录就是一个节点，后台定期重解析。
#           K8s 的 headless Service、Consul DNS、云内网负载均衡域名都能直接用。
[CLUSTER.discovery]
mode = "static"
dns_name = ""            # 例如 "ipclick.default.svc.cluster.local"
port = 9527              # 解析出来的地址统一用这个端口
refresh_interval = 30    # 重新解析间隔（秒）；0 = 只在启动时解析一次

# ------- 集群状态页 [CLUSTER.status_page] -------
# 只读页面：节点列表、健康状态、请求统计。不提供任何变更操作——
# 运维变更请改配置文件，网页改配置等于再开一个高价值攻击面。
[CLUSTER.status_page]
enabled = false
port = 9529
# 默认只监听本机：状态页会暴露内网节点地址与拓扑，不该默认对外。
# 需要远程访问请自行加反向代理并做鉴权。
host = "127.0.0.1"

# ================ 服务端配置 [SERVER] ================
[SERVER]
# 监听地址
host = "[::]"
# 监听端口
port = 9527
# 最大线程数（每个进行中的请求占用一个线程）
max_workers = 100

# ================ 安全配置 [SECURITY] ================
# 服务端会代替调用方请求任意 URL。若监听在公网或不可信网络，
# 请务必打开 block_private_networks，否则本服务可被当作内网跳板（SSRF）。
[SECURITY]
# 鉴权令牌是机密，不放这里 —— 用环境变量 / .env 的 IPCLICK_AUTH_TOKEN。
# 留空 = 不鉴权（服务端启动时会打显著告警）。
# 轮换期间要新旧并存的话，只能写在配置里（环境变量只接受单个）：
#   auth_token = ["新令牌", "旧令牌"]
# 注意：鉴权解决的是"谁能用"，SSRF 防护解决的是"能打到哪儿"，两者不能互相替代。
#
# 受信环境里就是想把机密写进本文件的话，打开下面这项可以关掉启动时的提醒。
# 机密仍然照常生效，只是不再每次启动都被点名。
allow_secrets_in_config = false
# 允许的 URL 协议
allowed_schemes = ["http", "https"]
# 拦截云厂商实例元数据地址（169.254.169.254 等），无正当代理用途，建议保持开启
block_metadata_endpoints = true
# 拦截回环 / 私网 / 保留地址。默认关闭以兼容"本机代理本机服务"的用法，
# 部署到不可信网络时应改为 true
block_private_networks = false
# 即便开启上面的拦截也放行的主机名或 IP
allowlist = []

# ------- 传输层加密 [SECURITY.tls] -------
# 默认关闭（明文），与旧部署兼容。但令牌鉴权保护的是"谁能用"，
# 明文链路上令牌本身会被同网段原样嗅探到——公网或不可信网络务必打开。
[SECURITY.tls]
enabled = false
# 服务端：自己的证书与私钥（必填）
# 客户端：只有服务端要求 mTLS 时才需要填
cert_file = ""
key_file = ""
# 验证**对端**用的 CA。
#   服务端：填了才会验证客户端证书；配合 require_client_cert 构成 mTLS
#   客户端：留空则用系统信任库（对接公网 CA 签发的证书时就该留空）
ca_file = ""
# 仅服务端：强制客户端出示证书（mTLS）。
# ⚠️ 打开时必须同时配 ca_file，否则任何自签名证书都能通过，等于没验证——
#    这种组合会在启动时直接报错，不会静默降级。
require_client_cert = false
# 仅客户端：证书里的名字与实际连接地址不一致时用它覆盖，
# 例如证书签给 "ipclick.internal" 而你连的是 "10.0.0.5"。
# ⚠️ 这会跳过主机名匹配，只应在自签名证书的内网环境里用。
server_name_override = ""

# ------- 下载器配置 [DOWNLOADER] -------
# 这些是"请求未显式传参时"的默认值。单次请求传的 timeout / max_retries /
# retry_backoff 优先级更高。
[DOWNLOADER]
# 连接超时（秒）
connect_timeout = 10
# 下载超时（秒）
download_timeout = 300
# 是否读取环境变量里的代理设置（HTTP_PROXY / ALL_PROXY）。
# 默认关闭：代理应由调用方显式指定，而不是取决于服务端所在机器的环境
trust_env = false
# 失败重试策略
[DOWNLOADER.retry]
max_attempts = 3                     # 最大重试次数（0 = 不重试）
backoff_exponent = 2.0               # 退避指数（等待 = initial_backoff * exponent^已重试次数）
initial_backoff = 1                  # 初始等待时间（秒）
max_backoff = 30                     # 单次等待上限（秒，硬上限 300）
retry_codes = [429, 500, 502, 503, 504]  # 触发重试的状态码；连接层异常总是会重试
# 连接池与按 host 的并发闸门
[DOWNLOADER.concurrency]
max_connections = 100           # 连接池总上限
max_keepalive_connections = 20  # 保持长连接的上限

# 单个目标 host 的并发上限（0 = 不限制）。严格限制：超出的请求在服务端排队。
# ⚠️ 服务端是一请求一线程，排队会占着 worker 线程。把这个值设得很小、同时又有
#    大量请求打向同一个 host 时，[SERVER].max_workers 要留够余量，否则其他 host
#    的请求会跟着饿死。
per_host_max_concurrent = 0
# 等待额度的上限（秒）。超时返回 RESOURCE_EXHAUSTED，而不是无限期占着线程。
per_host_wait_timeout = 30
# host 条目空闲多久后回收（秒）。爬虫会碰到无穷多域名，不回收就是内存泄漏。
per_host_idle_ttl = 300
# 同时跟踪的 host 数上限，防御性兜底
max_tracked_hosts = 10000

# 按 host 的速率限制（令牌桶）
[DOWNLOADER.rate_limit]
# 单个 host 每秒最多发起几个请求（0 = 不限制）。可以是小数，如 0.5 表示两秒一个。
per_host_qps = 0
# 突发额度（桶容量）。0 = 取 ceil(per_host_qps)，即最多攒够一秒的量。
per_host_burst = 0
# 限额只在本进程内计算。集群模式下任务统一从入口节点进来，在那一台上算就是
# 全局的，所以不需要 Redis 之类的中间件（0.3 起已移除 redis 后端）。

# 说明：分块下载（chunk）、临时存储（storage）尚未实现，已从默认配置移除，
# 避免"配了却不生效"。

# ------- 浏览器渲染配置 [BROWSER] -------
# 供浏览器渲染适配器使用（adapter = "browser" 或点名某个引擎）。
# 引擎按需单独安装，见下面 engine 的说明；每个引擎还要各自准备浏览器本体
# （或把 executable_path 指向系统已有的浏览器，省掉那 150MB 下载）。
[BROWSER]
# 总开关。关掉后即使装了引擎，请求浏览器适配器也会被拒绝——
# 浏览器渲染又重又是更大的攻击面，不需要时应该能一键关死。
enabled = true

# 渲染引擎。客户端请求 adapter = "browser"（通用）时用这里的设置决定引擎；
# 客户端也可以直接点名 camoufox / patchright / playwright / DrissionPage。
#
# ⚠️ 每个引擎都是**两步**安装：pip 装 Python 包，再单独准备浏览器本体。
#    只做第一步的话 ipclick config-info 会显示"包已装，浏览器本体未就绪"，
#    请求会直接报 FAILED_PRECONDITION 并告诉你该跑哪条命令——
#    刻意不让它在请求里自己去下载（camoufox 的本体约 1 GB，
#    那会让第一个请求卡几分钟然后超时，而下载还在后台继续）。
#   auto         按平台选：Windows -> drissionpage，Linux/macOS -> camoufox
#   camoufox     Firefox 内核，反检测最彻底，自带指纹伪装
#                pip install "ipclick[camoufox]" && python -m camoufox fetch
#                （fetch 下的是它自己那份 Firefox，约 1 GB，装在 ~/.cache/camoufox）
#   patchright   Playwright 的反检测分支，API 完全兼容
#                pip install "ipclick[patchright]" && patchright install chromium
#   playwright   原版，最稳、行为最可预期，无反检测处理
#                pip install "ipclick[playwright]" && playwright install chromium
#   drissionpage CDP 直连本机 Chrome，不额外下浏览器；Windows 上最省事
#                pip install "ipclick[drissionpage]"
engine = "auto"

# 内核：chromium / firefox / webkit。只对 playwright / patchright 有意义
# （camoufox 固定 Firefox，drissionpage 固定 Chromium）。
browser = "chromium"
# 无头模式（无 GUI 界面）
headless = true
# 浏览器可执行文件路径。留空则用 playwright 自己下载的那份。
# 容器里常见写法：executable_path = "/usr/bin/chromium"
executable_path = ""
# 传给浏览器进程的额外命令行参数
args = []
# 容器里没有 user namespace 时 chromium 起不来，需要打开这一项（等价于 --no-sandbox）。
# 默认关闭：关掉沙箱意味着页面里的代码更容易影响到宿主进程，应由部署方明确选择。
no_sandbox = false
# 用户代理。留空则每次请求随机生成一个。
user_agent = ""
# 视窗尺寸
viewport = { width = 1920, height = 1080 }
# 默认的等待时机：load / domcontentloaded / networkidle / commit
wait_until = "load"
# 默认拦截的资源类型，只取 HTML 时拦掉能省大量时间与带宽。
# 可选值：image media font stylesheet script xhr fetch websocket other
block_resources = ["image", "media", "font"]
# 同时打开的页面上限。无头浏览器每个页面几十上百 MB，不设上限很容易把机器打满。
# ⚠️ camoufox 是 Firefox 加一整套扩展，单个 context 的内存开销明显高于 Chromium 系。
#    内存紧张的机器（≤4GB）用 camoufox 时建议设成 1~2，否则会开始换页——请求
#    从几秒变成几分钟，看起来像卡死。
max_pages = 4
# 是否允许请求携带 automation_script。
# automation_script 是**在页面里执行的 JavaScript**（不是 Python）：
#     automation_script = "return document.querySelector('#price').innerText"
# 返回值经 x-ipclick-script-result 响应头带回。脚本写错（SyntaxError / ReferenceError）
# 会被判为参数错误直接报 INVALID_ARGUMENT，不重试。
# ⚠️ 默认关闭。页面内的 JS 会自己发请求，[SECURITY] 那套 URL 策略（禁云元数据、
# 禁内网）对它完全不起作用——放开它等于把 SSRF 防线让开一整条。
# 只有在确认调用方全部可信时才打开。
allow_scripts = false
# ---- 以下三项只对 camoufox 生效 ----
# 伪装的语言环境，如 "zh-CN"。留空则由 camoufox 自行生成。
locale = ""
# 模拟人类的鼠标移动。true 用默认时长，也可以写一个秒数上限（如 1.5）。
# 会显著拖慢每次请求，默认关闭。
humanize = false
# 让时区 / 语言 / 经纬度与代理出口 IP 对上。只有下面的 gateway 能生效——
# 按请求指定的代理是在 context 上设的，那时指纹早已生成完毕。
geoip = false

# 代理网关（覆盖系统代理）
[BROWSER.proxy]
gateway = ""                     # 例如 "http://127.0.0.1:8080"
bypass_list = []                 # 例如 ["*.internal.com"]
# 渲染超时控制（秒）
[BROWSER.timeout]
page_load = 30      # 页面加载超时
script_exec = 60    # automation_script 执行超时



# ================ Web 管理端 [WEB] ================
# 带登录的网页界面，展示运行状态、生效配置与集群节点。
# 命令行 `ipclick run --web` / `-w` 会覆盖下面的 enabled。
[WEB]
enabled = false
port = 9530
# 默认只监听本机。这个界面后面就是一个能代发任意请求的服务，不该默认对外；
# 需要远程访问请用 SSH 隧道，或放在做了 TLS 终止的反向代理之后
# （本身是明文 HTTP，密码会在网络上裸奔）。
host = "127.0.0.1"
# 登录凭据是机密，不放这里 —— 用环境变量 / .env：
#   IPCLICK_WEB_USER / IPCLICK_WEB_PASSWORD
# 都不设的话每次启动**随机生成密码并打印到控制台**。
# 不设默认口令是刻意的：默认弱口令是这类管理界面被打穿的头号原因。

# ================ 监控配置 [MONITOR] ================
[MONITOR]
# 是否注册 grpc.health.v1 健康检查服务（免鉴权，供 K8s 探针 / 服务网格使用）。
# 关闭后探活会收到 UNIMPLEMENTED。
health_check = true


# ================ 链路记录 [TRACE] ================
# 每个请求处理完记一条：谁处理的、用了哪个适配器、状态码、耗时、重试几次。
# 刻意不记请求头 / cookie / 请求体 / 代理串——那些含机密，而这些记录是要在
# Web 端展示的。要看完整请求内容请把 [LOG].level 调成 debug。
[TRACE]
# 内存里保留最近多少条。始终开启、零磁盘、上限固定，进程重启即丢。
# Web 端在不开落盘时就是看这个。0 = 关掉内存缓冲。
memory_size = 500

# 落盘到 SQLite。开了之后 Web 端才能查历史记录和跨天统计。
# 默认关：多数人只需要"刚才发生了什么"，不该默认在工作目录里造一个数据库文件。
sqlite_enabled = false
# 数据库路径（相对当前工作目录）。会额外生成 -wal / -shm 两个同名文件。
#
# {port} 会被替换成**运行时实际生效**的监听端口（--port 覆盖之后的那个）。
# 同一个目录用 --port 起多个实例时这一项必须岔开：多进程写同一个库不会报任何
# 错，链路记录会静默混在一起，界面上完全看不出来。占位符出现在路径中间也行，
# 例如 "trace/{port}/records.db"。
# 不想按端口分离就把 {port} 删掉——已有配置不会被自动改写。
sqlite_path = "ipclick-trace.{port}.db"
# 保留天数，超期的每小时清理一次。0 = 永久保留（不推荐，库会一直长）。
retention_days = 30
# 只记失败的请求。成功量极大又只关心异常时打开，能把库缩小一两个数量级。
only_errors = false
# 写队列容量。写盘跟不上时超出的记录会被丢弃并计数（绝不反压业务请求）。
queue_size = 5000
# 是否记录完整 URL。关掉后只记 host——不想把抓取目标落盘时用。
record_url = true


# ================ 日志配置 [LOG] ================
[LOG]
# 日志级别 (debug/info/warn/error)
level = "info"
# 日志格式。底层是 loguru，占位符是 {time}/{level}/{message} 这种花括号写法，
# 不是标准库 logging 的 %(asctime)s。留空则用内置格式（带颜色、含文件行号）。
# 例：format = "[{time:YYYY-MM-DD HH:mm:ss}] {level: <8} | {message}"
format = ""
# 日志输出位置。三种写法：
#   "stdout" / "stderr"  只打到控制台（默认）
#   "logs/app.log"       写这个文件（没有扩展名时自动补 .log）
#   "logs/"              以斜杠结尾（或指向一个已存在的目录）= 写进这个**目录**，
#                        文件名用 ipclick.log
# 最后一种以前会被静默改写成同级的 logs.log —— 0.4 修了，见 CHANGELOG。
#
# 和 [TRACE].sqlite_path 一样支持 {port} 占位符，替换成运行时实际生效的端口。
# 同目录起多实例时不岔开的话，多个进程会静默抢写同一个文件。
output = "stdout"
# 日志轮转配置 (当 output 为文件时生效)
[LOG.rotation]
max_size = 100   # 单文件最大(MB)
max_backups = 5  # 保留历史文件数

