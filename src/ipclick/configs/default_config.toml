# ================ SDK配置 [CLIENT] ================
# -------------- 基础配置 [GENERAL] --------------
[GENERAL]
# 程序运行模式: "standalone" (单机) | "cluster" (多机器/集群)
# ⚠️ 尚未实现：集群模式待 [CLUSTER] 一并支持，当前恒为单机
mode = "standalone"
# 调试模式 (开启后强制 DEBUG 级别日志，覆盖 [LOG].level)
debug = false

# ------- 代理配置 [PROXY] -------
# 供 downloader.get(url, proxy=True) 使用。默认留空表示"未配置代理"，
# 此时 proxy=True 会打一条警告并直连——不要在这里预置某台机器的本地代理地址，
# 否则所有用户的 proxy=True 都会指向他们自己的 127.0.0.1:7890（可能是别的服务）。
[PROXY]
scheme = 'http'
host = ''
port = 0
# 三方隧道代理
auth_key = ''
auth_password = ''
channel_name = ''
session_ttl = ''
country_code = ''
tunnel_server = ''

# ------- 集群配置 [CLUSTER] -------
# 供 ipclick.cluster.ClusterDownloader 使用：把请求分发到多个 IPClick 服务端。
# nodes 为空即视为未启用集群，此时用单节点的 Downloader。
[CLUSTER]
# 负载均衡策略：round_robin / random / weight
load_balancer = "round_robin"
# 连续探测失败多少次才摘除节点（避免一次抖动就让流量反复横跳）
failure_threshold = 2
# 连续探测成功多少次才把节点加回来
recovery_threshold = 2
# 探活间隔与单次超时（秒）。探活走 grpc.health.v1，免鉴权。
probe_interval = 10
probe_timeout = 3
# 一次请求最多换几个节点重试
max_failover = 2
# 节点列表。address 必填，其余可选。
nodes = [
    # { id = "node-101", address = "192.168.1.101:9527", region = "us-east-1", zone = "1a", weight = 100 },
]

# ------- 集群状态页 [CLUSTER.status_page] -------
# 只读页面：节点列表、健康状态、请求统计。不提供任何变更操作——
# 运维变更请改配置文件，网页改配置等于再开一个高价值攻击面。
[CLUSTER.status_page]
enabled = false
port = 9529
# 默认只监听本机：状态页会暴露内网节点地址与拓扑，不该默认对外。
# 需要远程访问请自行加反向代理并做鉴权。
host = "127.0.0.1"

# ================ 服务端配置 [SERVER] ================
[SERVER]
# 监听地址
host = "[::]"
# 监听端口
port = 9527
# 最大线程数（每个进行中的请求占用一个线程）
max_workers = 100

# ================ 安全配置 [SECURITY] ================
# 服务端会代替调用方请求任意 URL。若监听在公网或不可信网络，
# 请务必打开 block_private_networks，否则本服务可被当作内网跳板（SSRF）。
[SECURITY]
# 调用方必须携带的鉴权令牌。留空 = 不鉴权（服务端启动时会打显著告警）。
#
# 强烈建议用环境变量 IPCLICK_AUTH_TOKEN 提供，不要把密钥写进配置文件；
# 环境变量优先于此处。也可以写成列表以便轮换期间新旧令牌并存：
#   auth_token = ["新令牌", "旧令牌"]
#
# 注意：鉴权解决的是"谁能用"，SSRF 防护解决的是"能打到哪儿"，两者不能互相替代。
auth_token = ""
# 允许的 URL 协议
allowed_schemes = ["http", "https"]
# 拦截云厂商实例元数据地址（169.254.169.254 等），无正当代理用途，建议保持开启
block_metadata_endpoints = true
# 拦截回环 / 私网 / 保留地址。默认关闭以兼容"本机代理本机服务"的用法，
# 部署到不可信网络时应改为 true
block_private_networks = false
# 即便开启上面的拦截也放行的主机名或 IP
allowlist = []

# ------- 下载器配置 [DOWNLOADER] -------
# 这些是"请求未显式传参时"的默认值。单次请求传的 timeout / max_retries /
# retry_backoff 优先级更高。
[DOWNLOADER]
# 连接超时（秒）
connect_timeout = 10
# 下载超时（秒）
download_timeout = 300
# 是否读取环境变量里的代理设置（HTTP_PROXY / ALL_PROXY）。
# 默认关闭：代理应由调用方显式指定，而不是取决于服务端所在机器的环境
trust_env = false
# 失败重试策略
[DOWNLOADER.retry]
max_attempts = 3                     # 最大重试次数（0 = 不重试）
backoff_exponent = 2.0               # 退避指数（等待 = initial_backoff * exponent^已重试次数）
initial_backoff = 1                  # 初始等待时间（秒）
max_backoff = 30                     # 单次等待上限（秒，硬上限 300）
retry_codes = [429, 500, 502, 503, 504]  # 触发重试的状态码；连接层异常总是会重试
# 连接池
[DOWNLOADER.concurrency]
max_connections = 100           # 连接池总上限
max_keepalive_connections = 20  # 保持长连接的上限

# 说明：限速（rate_limit）、分块下载（chunk）、临时存储（storage）依赖真正的
# 流式传输通路，当前的 protobuf 协议是整个响应体一条消息，无法支持。
# 这些配置项已从默认配置移除，待流式下载实现后再引入，避免"配了却不生效"。

# ------- 浏览器渲染配置 [BROWSER] -------
# 供 playwright 适配器使用（adapter = "playwright"）。
# 需要额外安装：pip install "ipclick[browser]"，再 playwright install chromium
# （或把 executable_path 指向系统已有的浏览器，省掉那 150MB 下载）。
[BROWSER]
# 总开关。关掉后即使装了 playwright，请求 adapter = "playwright" 也会被拒绝——
# 浏览器渲染又重又是更大的攻击面，不需要时应该能一键关死。
enabled = true
# 内核：chromium / firefox / webkit
browser = "chromium"
# 无头模式（无 GUI 界面）
headless = true
# 浏览器可执行文件路径。留空则用 playwright 自己下载的那份。
# 容器里常见写法：executable_path = "/usr/bin/chromium"
executable_path = ""
# 传给浏览器进程的额外命令行参数
args = []
# 容器里没有 user namespace 时 chromium 起不来，需要打开这一项（等价于 --no-sandbox）。
# 默认关闭：关掉沙箱意味着页面里的代码更容易影响到宿主进程，应由部署方明确选择。
no_sandbox = false
# 用户代理。留空则每次请求随机生成一个。
user_agent = ""
# 视窗尺寸
viewport = { width = 1920, height = 1080 }
# 默认的等待时机：load / domcontentloaded / networkidle / commit
wait_until = "load"
# 默认拦截的资源类型，只取 HTML 时拦掉能省大量时间与带宽。
# 可选值：image media font stylesheet script xhr fetch websocket other
block_resources = ["image", "media", "font"]
# 同时打开的页面上限。无头浏览器每个页面几十上百 MB，不设上限很容易把机器打满。
max_pages = 4
# 是否允许请求携带 automation_script（在页面里执行任意 JS）。
# ⚠️ 默认关闭。页面内的 JS 会自己发请求，[SECURITY] 那套 URL 策略（禁云元数据、
# 禁内网）对它完全不起作用——放开它等于把 SSRF 防线让开一整条。
# 只有在确认调用方全部可信时才打开。
allow_scripts = false
# 代理网关（覆盖系统代理）
[BROWSER.proxy]
gateway = ""                     # 例如 "http://127.0.0.1:8080"
bypass_list = []                 # 例如 ["*.internal.com"]
# 渲染超时控制（秒）
[BROWSER.timeout]
page_load = 30      # 页面加载超时
script_exec = 60    # automation_script 执行超时



# ================ 监控配置 [MONITOR] ================
[MONITOR]
# 是否注册 grpc.health.v1 健康检查服务（免鉴权，供 K8s 探针 / 服务网格使用）。
# 关闭后探活会收到 UNIMPLEMENTED。
health_check = true

# Prometheus 指标端点。需要可选依赖：pip install "ipclick[metrics]"
# 默认关闭：指标端点通常比业务端口设防更少，应由部署方显式决定是否开、开在哪。
metrics_enabled = false
metrics_port = 9528
# 容器内 Prometheus 从外部抓取，所以默认监听所有网卡；
# 若只允许本机抓取（如通过 sidecar），改成 127.0.0.1
metrics_host = "0.0.0.0"


# ================ 日志配置 [LOG] ================
[LOG]
# 日志级别 (debug/info/warn/error)
level = "info"
# 日志格式
format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
# 日志输出位置 (stdout 或文件路径)
output = "stdout"
# 日志轮转配置 (当 output 为文件时生效)
[LOG.rotation]
max_size = 100   # 单文件最大(MB)
max_backups = 5  # 保留历史文件数

