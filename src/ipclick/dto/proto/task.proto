// 修改本文件后请运行：uv run python src/ipclick/dto/proto/generate.py
// （该脚本会调用 protoc 并把生成代码里的顶层导入改成包内相对导入）

syntax = "proto3";

package task;

// =====================================
// 基础枚举定义
// =====================================

// 适配器类型枚举
enum AdapterType {
  CURL_CFFI = 0;
  // 已移除：httpx 与 niquests 能力重叠（niquests 还多支持 HTTP/3），
  // 维护两套等价的 HTTP 适配器不划算。
  HTTPX = 1 [deprecated = true];
  // 已移除：requests 适配器被 niquests 取代（后者 API 相同且支持 HTTP/2、HTTP/3）。
  // 编号保留不复用——0.2.3 已发布，旧客户端仍可能发来这个值。
  REQUESTS = 2 [deprecated = true];
  DRISSIONPAGE = 3;
  UC = 4; // undetected-chromedriver（未实现）
  PLAYWRIGHT = 5;
  CAMOUFOX = 6;   // 基于 Firefox 的反检测浏览器，Playwright API 兼容
  PATCHRIGHT = 7; // Playwright 的反检测分支，API 完全兼容
  // "用浏览器渲染，具体引擎由服务端决定"。引擎取自 [BROWSER].engine，
  // 默认按平台选：Windows -> DrissionPage，Linux/macOS -> Camoufox。
  // 客户端不必关心服务端装了哪个内核。
  BROWSER = 8;
  NIQUESTS = 9;
}

// HTTP 方法枚举
enum HttpMethod {
  GET = 0;
  POST = 1;
  PUT = 2;
  DELETE = 3;
  PATCH = 4;
  HEAD = 5;
  OPTIONS = 6;
  TRACE = 7;
}


// =====================================
// 主要任务消息定义
// =====================================

// 请求消息
message ReqTask {
  string uuid = 1;  // 唯一标识符
  AdapterType adapter = 2;  // 下载适配器

  // 协议
  HttpMethod method = 3;  // 请求方法
  string url = 4;  // 请求 URL
  map<string, string> headers = 5;  // 请求头（键值对）
  map<string, string> cookies = 6;  // 请求 cookies
  string params = 7;  // 查询参数（键值对）
  // bytes 而非 string：proto3 的 string 必须是合法 UTF-8，用它装二进制体
  // （图片、gzip、非 UTF-8 表单）会直接抛 DecodeError。改成 bytes 后线上字节
  // 完全相同，旧客户端(string) -> 新服务端(bytes) 无损；只有新客户端发非
  // UTF-8 数据给旧服务端才会失败，而那本来就是做不到的事。
  bytes data = 8;  // 请求体（任意字节）
  string json = 9;  // JSON
  string proxy = 10;  // 代理信息
  // 以下字段使用 optional（显式存在性）。proto3 的隐式默认值会让 "未设置" 和
  // "显式设为 0/false" 无法区分——曾导致未设置的 verify_ssl 在服务端变成
  // false（静默关闭证书校验）、未设置的 timeout_seconds 变成 0。
  optional float timeout_seconds = 11;  // 超时时间（秒，未设置时服务端用默认值）
  optional int32 max_retries = 12;  // 重试次数（0 表示显式不重试）
  optional float retry_backoff_seconds = 13;  // 重试间隔（秒，支持指数退避扩展）
  optional bool verify_ssl = 14;  // 是否验证 SSL（未设置时服务端按 true 处理）
  optional bool allow_redirects = 15;  // 是否跟随重定向（未设置时服务端按 true 处理）
  optional bool stream = 16;  // 是否流式传输（未设置时服务端按 false 处理）

  string impersonate = 17; // curl_cffi专用
  // 18 曾是 extensions：三个适配器全都不读它，纯死字段。
  // （原设想是远程指定浏览器扩展，但那要求每台机器预放插件目录，
  //   且 Chromium 系加载扩展必须用持久化 profile，与请求间隔离冲突。）
  reserved 18;

  // 渲染
  string automation_config = 19;  // 自动化框架的配置（JSON：wait_for_selector / screenshot 等）
  // 在页面里执行的 **JavaScript**（不是 Python）。返回值会以
  // x-ipclick-script-result 响应头带回。需要服务端 [BROWSER].allow_scripts = true。
  // 脚本本身写错（SyntaxError / ReferenceError）会被判为参数错误，不重试。
  string automation_script = 20;

  repeated int32 allowed_status_codes = 21;  // 重试白名单，如 [200, 404]

  string kwargs = 22; // 其他参数
}

// 响应消息
message TaskResp {
  string request_uuid = 1;
  AdapterType adapter = 2;  // 下载适配器
  // 3 曾是 original_request：里面含代理账号密码，且把整个请求（可能几 MB 的
  // body）原样回传会让响应体积翻倍。查链路真正要的是"谁处理的、重试几次"，
  // 那些在下面的 trace 里。
  reserved 3;
  string effective_url = 4;  // 实际 URL
  int32 status_code = 5;  // 响应状态码
  map<string, string> response_headers = 6;  // 响应头
  bytes content = 7;
  string error_message = 8;  // 错误信息（如果失败）
  int64 response_time_ms = 9;  // 响应时间（毫秒）
  Trace trace = 10;  // 链路信息，用于排查"这个请求到底怎么跑的"
}


// 链路信息。刻意只放"调用方查不到、但确实需要"的东西，且不含任何机密。
message Trace {
  string node_id = 1;      // 真正执行的节点（集群转发时是关键信息）
  string adapter = 2;      // 实际用的适配器（browser 会被解析成具体引擎名）
  int32 attempts = 3;      // 适配器内部重试了几次
  bool forwarded = 4;      // 是否经由其他节点转发而来
  int64 queued_ms = 5;     // 在按 host 限流的闸门里排了多久
}


// 流式响应的第一条消息：元信息。
// 拆成 header + chunk 两段是为了让调用方在拿到第一个字节前就知道状态码和响应头，
// 从而可以尽早决定是继续接收还是放弃。
message TaskRespHeader {
  string request_uuid = 1;
  AdapterType adapter = 2;
  string effective_url = 3;
  int32 status_code = 4;
  map<string, string> response_headers = 5;
  string error_message = 6;  // 非空表示失败，后续不会再有 chunk
  int64 content_length = 7;  // -1 表示服务端也不知道总长度
}

// 流式响应的消息包络。
message TaskRespChunk {
  oneof payload {
    TaskRespHeader header = 1;  // 恰好一条，且总是第一条
    bytes chunk = 2;            // 零条或多条，按到达顺序拼接即为完整响应体
    TaskRespTrailer trailer = 3;  // 恰好一条，且总是最后一条
  }
}

// 流式响应的最后一条消息：只有传完才知道的统计信息。
message TaskRespTrailer {
  int64 response_time_ms = 1;
  int64 total_bytes = 2;
  string error_message = 3;  // 传输中途出错时非空（此时前面的 chunk 是不完整的）
}


// =====================================
// 服务定义
// =====================================

service TaskService {
  // 单次请求，响应体整条返回。适合中小响应。
  rpc Send(ReqTask) returns (TaskResp) {}

  // 流式下载：响应体分片返回，服务端与客户端都不需要把整个 body 驻留内存。
  // 大文件请用这个而不是 Send。
  rpc SendStream(ReqTask) returns (stream TaskRespChunk) {}

  // 批量：客户端流式推送任务，服务端按**完成顺序**（不是提交顺序）流式返回结果。
  // 相比逐个调用 Send，省掉了每个任务一次往返的开销。
  rpc SendBatch(stream ReqTask) returns (stream TaskResp) {}
}