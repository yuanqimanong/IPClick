name: Release

# 发布到 PyPI。使用 Trusted Publishing（OIDC），仓库里不存任何 API token。
#
# 触发方式：
#   1. 推送 v* 标签（如 v0.2.3）—— 常规发布路径
#   2. 手动触发 workflow_dispatch —— 用于补发已有标签，或先发 TestPyPI 验证
#
# 发布这一步跑在 GitHub Environment 里，可在其中配置人工审批与分支/标签限制。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "要发布的标签或提交（留空则用当前分支）"
        required: false
        type: string

permissions: {}

jobs:
  # ---------------------------------------------------------------- #
  # 构建并做发布前校验。产物通过 artifact 传给后续 job，
  # 保证「被校验的字节」和「被上传的字节」是同一份。
  # ---------------------------------------------------------------- #
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install uv
        # 钉精确版本而不是 @v10：setup-uv 从 v8 起不再发布移动的 major/minor 标签
        # （防 tj-actions 那类供应链攻击），@v10 这个 ref 根本不存在，写了会直接找不到 action。
        # 升级要手动改这里。actions/* 那几个仍然发移动 major 标签，所以照旧写 @v7 / @v8。
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        # 不用 --all-extras：[camoufox] 与 [playwright] 在 [tool.uv].conflicts
        # 里是互斥的，同时点亮会直接解不出来。见 ci.yml 里的同一处说明。
        run: >-
          uv sync --frozen
          --group lint --group test
          --extra niquests --extra camoufox --extra patchright --extra drissionpage

      - name: Lint / format / types
        run: |
          uv run ruff check src/ tests/
          uv run ruff format --check src/ tests/
          uv run basedpyright src/ tests/

      - name: Test
        run: uv run pytest

      - name: Build
        run: uv build

      - name: Read version and check tag agreement
        id: meta
        run: |
          version="$(uv run python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pyproject version: $version"

          # 标签触发时，标签必须与 pyproject 版本一致，否则发出去的版本号会对不上
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::标签 v$tag 与 pyproject.toml 中的版本 $version 不一致"
              exit 1
            fi
          fi

      - name: Verify artifacts
        run: |
          uvx twine check dist/*
          python - <<'PY'
          import glob, sys, zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()

          required = [
              "ipclick/configs/default_config.toml",
              "ipclick/dto/proto/task_pb2.py",
              # 类型存根：漏了它，装了本包的下游 pyright 会把 proto 消息全看成 Any
              "ipclick/dto/proto/task_pb2.pyi",
              "ipclick/py.typed",
              # 运行时要读的数据文件，不是文档：`ipclick skill show/install` 直接
              # 读它。漏打包的话命令会在用户机器上炸，而 CI 全绿。
              "ipclick/skills/ipclick/SKILL.md",
          ]
          if missing := [r for r in required if r not in names]:
              sys.exit(f"wheel 缺少文件: {missing}")

          # 不该出现在分发包里的东西。
          # 注意别用 `"test" in name` 这种子串匹配：包内合法存在名字带 test 的模块
          # （例如渲染「试一试」页的模板），那样会把正常发布拦下来。只认真正的
          # 测试目录与 pytest 的文件命名约定。
          import posixpath

          def _is_leak(name: str) -> bool:
              base = posixpath.basename(name)
              return (
                  name.startswith("tests/")
                  or "/tests/" in name
                  or base.startswith("test_")
                  or base.endswith("_test.py")
                  or "__pycache__" in name
                  or base in (".env", ".git", ".gitignore")
              )

          if leaked := [n for n in names if _is_leak(n)]:
              sys.exit(f"wheel 含不应分发的文件: {leaked}")

          # README 会作为 long_description 成为 PyPI 项目页正文，且**上传后不可修改**。
          # 相对链接会相对 https://pypi.org/project/ipclick/<version>/ 解析 → 404，
          # 而这个 404 只能靠发一个新版本来修。
          #
          # 原先这里查的是 `](LICENSE)` 和 `](CHANGELOG.md)` 两个写死的字符串。
          # 那是个白名单式的守卫：它拦得住已经踩过的两个坑，拦不住第三个。
          # 0.7.0 发版自检就是这么漏掉 README 里的 `](docker/构建.md)` 的——
          # 守卫在、也跑了、还是绿的。改成通用检查：凡是不带协议、不是锚点的
          # Markdown 链接目标一律拦。
          import re

          meta = zipfile.ZipFile(wheel).read(
              next(n for n in names if n.endswith("METADATA"))
          ).decode()
          relative = sorted({
              target
              for target in re.findall(r"\]\(([^)\s]+)", meta)
              if not target.startswith(("http://", "https://", "#", "mailto:", "data:"))
          })
          if relative:
              sys.exit(f"METADATA 中存在相对链接，PyPI 上会 404：{relative}")

          print(f"{wheel} 校验通过")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # ---------------------------------------------------------------- #
  # 发布到 PyPI。
  # environment: pypi 上配置了「必需审批人」，上传前会停下来等人工确认——
  # PyPI 同一版本号永远不能重传，只能 yank。
  # ---------------------------------------------------------------- #
  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    # 刻意不设 timeout-minutes：这个 job 卡在 environment 的人工审批上，
    # 而审批可能要等几小时甚至隔天。上传本身只有几秒，真正的风险不是它跑太久，
    # 而是一个超时把等待审批的发布悄悄掐掉。
    environment:
      name: pypi
      url: https://pypi.org/p/ipclick
    permissions:
      id-token: write # Trusted Publishing 需要，用于取 OIDC token
    steps:
      # download-artifact v8 起，下载摘要对不上会**直接失败**（v7 及以前只打警告）。
      # 这正是这条流水线要的：上面那句"被校验的字节和被上传的字节是同一份"，
      # 靠的就是产物在传递过程中没被动过。别把 digest-mismatch 调回 warn。
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        # 不设 skip-existing：正式发布时重复版本应当失败并让人知道

  # ---------------------------------------------------------------- #
  # 发布成功后补一个 GitHub Release（仅标签触发）
  # ---------------------------------------------------------------- #
  github-release:
    if: github.event_name == 'push'
    needs: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "已发布到 PyPI: https://pypi.org/project/ipclick/${{ needs.build.outputs.version }}/

          完整变更见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)。" \
            --verify-tag
