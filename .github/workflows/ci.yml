name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 适配器默认不读环境代理，这里也确保 runner 上没有残留代理变量
  NO_PROXY: "*"

jobs:
  test:
    runs-on: ubuntu-latest
    # 兜底：GitHub 默认 6 小时，而这个 job 实测最长 8.5 分钟。挂住的 job
    # 占着并发额度，还会让 PR 的检查一直显示 pending，看不出是坏了还是慢。
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # ⚠️ 只测最新版，而 pyproject 里声明的是 requires-python = ">=3.11"。
        # 也就是说 3.11 / 3.12 / 3.13 是**声称支持但不做验证**的——在那几个版本上
        # 装不上或跑挂，CI 不会告诉你。这是有意的取舍（换 CI 时间），不是遗漏；
        # 哪天想收回这个取舍，把它们加回这个数组即可，别的都不用动。
        #
        # 另外注意别写成 "3.14t"：自由线程版的 SOABI 是 cpython-314t，
        # grpcio / orjson 都没发对应轮子，会退化成源码编译并卡在 Rust 工具链上。
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        # --all-extras：装上可选的 metrics / requests / playwright 依赖，
        # 否则相关测试会被整体跳过
        run: uv sync --frozen --all-groups --all-extras

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/

      - name: Format check (ruff)
        run: uv run ruff format --check src/ tests/

      - name: Type check (basedpyright)
        run: uv run basedpyright src/

      - name: Tests
        # IPCLICK_TEST_ENGINES 置空 = 不跑真起浏览器的渲染用例（它们干净跳过，
        # 68 个）。那部分挪到下面独立的 browser job 里，理由见那里。
        # 引擎选择、配置解析、安装提示这些纯逻辑的浏览器测试**照常在这里跑**。
        env:
          IPCLICK_TEST_ENGINES: ""
        # -n auto：按 runner 的核数并行。测试这一步占整个 job 的 79%
        # （实测 177s / 223s），并行之后本地从 72 秒降到 25 秒。
        # 覆盖率在 xdist 下要靠 pytest-cov 自己合并子进程数据，它原生支持。
        run: uv run pytest -n auto --cov=ipclick --cov-report=term-missing --cov-report=xml

      - name: Verify protobuf stubs are up to date
        run: |
          uv run python src/ipclick/dto/proto/generate.py
          git diff --exit-code -- src/ipclick/dto/proto/ \
            || (echo "::error::task.proto 改动后未重新生成代码，请运行 uv run python src/ipclick/dto/proto/generate.py" && exit 1)

  # ------------------------------------------------------------------ #
  # 浏览器渲染用例单独一个 job。
  #
  # 为什么拆出来：装浏览器要跑 `playwright install --with-deps`，而 --with-deps
  # 会走 apt-get，runner 上的 unattended-upgrades 偶尔占住 dpkg 锁不放。同一条
  # 命令实测耗时从 **47 秒到 25 分钟** 不等（25 分钟那次是彻底卡死被人工取消的）。
  #
  # 混在主 job 里的代价不是"慢"，而是**反馈被它挡在后面**：lint 写错要等它装完
  # 才知道，卡死那次更是等了 25 分钟才发现连 lint 都没跑到。拆开之后 lint /
  # 类型检查 / 1300+ 单元测试在 ~1 分钟内出结果，浏览器那边慢或抖都不影响。
  #
  # 另外把浏览器本体缓存起来，省掉每次约 300MB 的下载（apt 那部分省不掉，
  # 它是系统库；但下载是大头之一）。
  # ------------------------------------------------------------------ #
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen --all-groups --all-extras

      - name: Cache browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: ms-playwright-${{ runner.os }}-

      - name: Install chromium
        # 只装 chromium：三个内核全下要几分钟。patchright 用自己那份补丁版，
        # 要单独装。camoufox 的 Firefox（约 100MB+）不下：它的渲染用例默认
        # 就不在 IPCLICK_TEST_ENGINES 里。DrissionPage 用 runner 自带的 Chrome。
        timeout-minutes: 12
        run: |
          uv run playwright install --with-deps chromium
          uv run patchright install chromium

      - name: Browser render tests
        env:
          IPCLICK_TEST_ENGINES: "playwright,patchright"
        run: uv run pytest tests/test_browser_adapter.py tests/test_drission_adapter.py -q

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build wheel and sdist
        run: uv build

      - name: Check package metadata
        run: uv run --with twine twine check dist/*

      - name: Verify package data is included
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = [
              "ipclick/configs/default_config.toml",
              "ipclick/dto/proto/task_pb2.py",
              "ipclick/py.typed",
          ]
          missing = [r for r in required if r not in names]
          if missing:
              sys.exit(f"wheel 缺少文件: {missing}")
          print("wheel 内容完整")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f docker/Dockerfile -t ipclick:ci .

      - name: Smoke test the image
        run: |
          docker run --rm ipclick:ci ipclick --version
          docker run --rm ipclick:ci ipclick config-info
