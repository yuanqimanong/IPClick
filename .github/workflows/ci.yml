name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 适配器默认不读环境代理，这里也确保 runner 上没有残留代理变量
  NO_PROXY: "*"

jobs:
  # ---------------------------------------------------------------- #
  # 静态检查。装齐可选适配器，否则 basedpyright 会把它们的 import 报成
  # unresolved——而那正是 CI 该替人盯住的地方。
  # 只跑一个 Python 版本：pyright 的目标版本由 [tool.pyright].pythonVersion
  # 固定，矩阵化只会把同一份结论算多遍。
  # ---------------------------------------------------------------- #
  checks:
    runs-on: ubuntu-latest
    # 兜底：GitHub 默认 6 小时。挂住的 job 占着并发额度，
    # 还会让 PR 的检查一直显示 pending，看不出是坏了还是慢。
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        # 刻意不用 --all-extras：[camoufox] 与 [playwright] 已在 pyproject 的
        # [tool.uv].conflicts 里声明为互斥（camoufox 钉着 playwright<1.61），
        # --all-extras 会同时点亮两者而直接失败。这里逐个列出，覆盖到每个
        # 可选适配器的 import —— playwright 本体由 camoufox 带进来。
        # 只装 lint / proto 两组：跑测试是 test job 的事，twine 是 build job 的。
        run: >-
          uv sync --frozen
          --group lint --group proto
          --extra niquests --extra camoufox --extra patchright --extra drissionpage

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/

      - name: Format check (ruff)
        run: uv run ruff format --check src/ tests/

      - name: Type check (basedpyright)
        run: uv run basedpyright src/ tests/

      - name: Verify protobuf stubs are up to date
        run: |
          uv run python src/ipclick/dto/proto/generate.py
          git diff --exit-code -- src/ipclick/dto/proto/ \
            || (echo "::error::task.proto 改动后未重新生成代码，请运行 uv run python src/ipclick/dto/proto/generate.py" && exit 1)

  # ---------------------------------------------------------------- #
  # 测试。刻意**不装任何 extra**：绝大多数用户只装核心依赖，
  # 于是这个 job 同时验证「可选适配器缺席时仍能 import 与运行」。
  # ---------------------------------------------------------------- #
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 对齐 requires-python = ">=3.11"，只测两端。中间的 3.12 / 3.13 仍是
        # 声称支持但不做验证——这是有意的取舍（换 CI 时间），要收回就往这里加。
        #
        # 注意别写成 "3.14t"：自由线程版的 SOABI 是 cpython-314t，
        # grpcio / orjson 都没发对应轮子，会退化成源码编译并卡在 Rust 工具链上。
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --no-default-groups --group test

      - name: Run tests
        run: uv run --no-default-groups --group test pytest

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build wheel and sdist
        run: uv build

      - name: Check package metadata
        # uvx 而不是 uv run：这一步只需要 twine，不必为它把整个项目连依赖装一遍
        run: uvx twine check dist/*

      - name: Verify package data is included
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = [
              "ipclick/configs/default_config.toml",
              "ipclick/dto/proto/task_pb2.py",
              # 类型存根：漏了它，装了本包的下游 pyright 会把 proto 消息全看成 Any
              "ipclick/dto/proto/task_pb2.pyi",
              "ipclick/py.typed",
              # 运行时要读的数据文件，不是文档：`ipclick skill show/install` 直接
              # 读它。漏打包的话命令会在用户机器上炸，而 CI 全绿。
              "ipclick/skills/ipclick/SKILL.md",
          ]
          missing = [r for r in required if r not in names]
          if missing:
              sys.exit(f"wheel 缺少文件: {missing}")
          print("wheel 内容完整")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    runs-on: ubuntu-latest
    # 默认镜像要下 chromium 本体（约 1.5 GB），比纯 Python 构建慢得多。
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # 先建不带浏览器的那份：几分钟就能出结果，Dockerfile 本身写错了在这里就红，
      # 不用等完整镜像下完 chromium 才发现。
      - name: Build slim image (ENGINE=none)
        run: docker build -f docker/Dockerfile --build-arg ENGINE=none -t ipclick:slim .

      - name: Smoke test the slim image
        run: |
          docker run --rm ipclick:slim ipclick --version
          docker run --rm ipclick:slim ipclick config-info

      # 再建实际发布的那份（自带 patchright + chromium）。
      - name: Build default image (bundled render engine)
        run: docker build -f docker/Dockerfile -t ipclick:ci .

      - name: Smoke test the image
        run: |
          docker run --rm ipclick:ci ipclick --version
          docker run --rm ipclick:ci ipclick config-info
          docker run --rm ipclick:ci python -V

      # 验证浏览器本体真的打进去了、而且非 root 用户读得到。
      # 这一步比"能 import patchright"严格：组件状态是两级的，
      # 只有包和本体都就位才会报「就绪」。刻意不发真实请求——
      # CI 里依赖外部站点会引入无关的红。
      - name: Verify the render engine is usable in the image
        run: |
          out=$(docker run --rm ipclick:ci ipclick component list)
          echo "$out"
          if ! echo "$out" | grep -qE 'patchright[[:space:]]+就绪'; then
            echo "::error::镜像里的 patchright 不可用（包或浏览器本体缺失）"
            exit 1
          fi
          echo "渲染引擎可用"

