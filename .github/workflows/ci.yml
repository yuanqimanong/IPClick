name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 适配器默认不读环境代理，这里也确保 runner 上没有残留代理变量
  NO_PROXY: "*"

jobs:
  test:
    runs-on: ubuntu-latest
    # 兜底：GitHub 默认 6 小时，而这个 job 实测最长 8.5 分钟。挂住的 job
    # 占着并发额度，还会让 PR 的检查一直显示 pending，看不出是坏了还是慢。
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # ⚠️ 只测最新版，而 pyproject 里声明的是 requires-python = ">=3.11"。
        # 也就是说 3.11 / 3.12 / 3.13 是**声称支持但不做验证**的——在那几个版本上
        # 装不上或跑挂，CI 不会告诉你。这是有意的取舍（换 CI 时间），不是遗漏；
        # 哪天想收回这个取舍，把它们加回这个数组即可，别的都不用动。
        #
        # 另外注意别写成 "3.14t"：自由线程版的 SOABI 是 cpython-314t，
        # grpcio / orjson 都没发对应轮子，会退化成源码编译并卡在 Rust 工具链上。
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        # --all-extras：装上可选的 metrics / requests / playwright 依赖，
        # 否则相关测试会被整体跳过
        run: uv sync --frozen --all-groups --all-extras

      - name: Lint (ruff)
        run: uv run ruff check src/

      - name: Format check (ruff)
        run: uv run ruff format --check src/

      - name: Type check (basedpyright)
        run: uv run basedpyright src/

      - name: Verify protobuf stubs are up to date
        run: |
          uv run python src/ipclick/dto/proto/generate.py
          git diff --exit-code -- src/ipclick/dto/proto/ \
            || (echo "::error::task.proto 改动后未重新生成代码，请运行 uv run python src/ipclick/dto/proto/generate.py" && exit 1)

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build wheel and sdist
        run: uv build

      - name: Check package metadata
        run: uv run --with twine twine check dist/*

      - name: Verify package data is included
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = [
              "ipclick/configs/default_config.toml",
              "ipclick/dto/proto/task_pb2.py",
              "ipclick/py.typed",
              # 运行时要读的数据文件，不是文档：`ipclick skill show/install` 直接
              # 读它。漏打包的话命令会在用户机器上炸，而 CI 全绿。
              "ipclick/skills/ipclick/SKILL.md",
          ]
          missing = [r for r in required if r not in names]
          if missing:
              sys.exit(f"wheel 缺少文件: {missing}")
          print("wheel 内容完整")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f docker/Dockerfile -t ipclick:ci .

      - name: Smoke test the image
        run: |
          docker run --rm ipclick:ci ipclick --version
          docker run --rm ipclick:ci ipclick config-info
