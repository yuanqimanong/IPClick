[project]
name = "ipclick"
version = "2.0.0"
description = "IPClick Tool"
authors = [
    { name = "元气码农少女酱", email = "1276162429@qq.com" }
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["http", "grpc", "downloader", "scraping", "browser", "cluster"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "curl-cffi>=0.16.0,<0.17.0",
    "grpcio>=1.83.0,<2.0.0",
    "grpcio-health-checking>=1.83.0,<2.0.0",
    "protobuf>=7.35.1,<8.0.0",
    "click>=8.4.2,<9.0.0",
    "fake-useragent>=2.2.0,<3.0.0",
    "loguru>=0.7.3,<0.8.0",
    "python-box[all]>=7.4.1,<8.0.0",
    "uuid-utils>=0.17.0,<0.18.0",
    "typing-extensions>=4.16.0,<5.0.0",
]

[project.optional-dependencies]
niquests = ["niquests>=3.21.0,<4.0.0"]

camoufox = ["camoufox>=0.5.4,<1.0.0"]
patchright = ["patchright>=1.61.2,<2.0.0"]
drissionpage = ["drissionpage>=4.1.1,<5.0.0"]
playwright = ["playwright>=1.62.0,<2.0.0"]

win = ["ipclick[drissionpage]"]
linux = ["ipclick[camoufox,patchright]"]

[project.urls]
"Homepage" = "https://github.com/yuanqimanong/IPClick"
"Repository" = "https://github.com/yuanqimanong/IPClick"
"Bug Tracker" = "https://github.com/yuanqimanong/IPClick/issues"

[project.scripts]
ipclick = "ipclick.__main__:main"


[build-system]
requires = ["uv_build>=0.9.18,<0.13.0"]
build-backend = "uv_build"


[tool.uv]
required-version = ">=0.9.18"
default-groups = ["dev"]
conflicts = [
    [{ extra = "camoufox" }, { extra = "playwright" }],
    [{ extra = "linux" }, { extra = "playwright" }],
]

[tool.uv.build-backend]
module-name = "ipclick"
module-root = "src"

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
]
lint = [
    "basedpyright>=1.39.9",
    "ruff>=0.16.1",
]
proto = [
    "grpcio-tools>=1.83.0,<2.0.0",
]
release = [
    "twine>=6.2.0,<8.0.0",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "proto" },
    { include-group = "release" },
]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "slow: 起真实 gRPC 端口的用例，比纯单元测试慢一个数量级",
]


[tool.pyright]
include = ["src", "tests"]
exclude = [
    "**/__pycache__",
    ".venv",
    ".pytest_cache",
    "**/dto/proto/*.py",
    "**/dto/proto/*_pb2*.py",
    "**/dto/proto/*.pyi",
    "**/generated/**"
]
pythonVersion = "3.11"

reportAny = false
reportExplicitAny = false
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportImplicitStringConcatenation = false
reportUnusedCallResult = false
reportIncompatibleMethodOverride = false
reportUnsafeMultipleInheritance = false
reportMissingSuperCall = false

[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = "none"

[[tool.pyright.executionEnvironments]]
root = "src"


[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py311"
extend-exclude = [
    "src/ipclick/dto/proto/*_pb2*.py",
    "src/ipclick/dto/proto/*_pb2*.pyi",
]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false
indent-style = "space"

[tool.ruff.lint]
select = [
    "E", # pycodestyle 错误
    "W", # pycodestyle 警告
    "F", # Pyflakes - 包含 F401
    "I", # isort - 导入排序
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "TID", # flake8-tidy-imports
    "SIM", # flake8-simplify
    "RUF", # ruff 自有规则
]

ignore = [
    "E501", # 行长度由 formatter 负责
    "B008", # 允许在默认参数中调用函数
    "RUF001", # 字符串中的全角标点
    "RUF002", # 文档字符串中的全角标点
    "RUF003", # 注释中的全角标点
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["ipclick"]
lines-after-imports = 2
force-sort-within-sections = true
