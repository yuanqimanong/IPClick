[project]
name = "ipclick"
version = "0.2.0"
description = "IPClick Tool"
authors = [
    { name = "元气码农少女酱", email = "1276162429@qq.com" }
]
license = { text = "MIT License" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "curl-cffi>=0.16.0,<0.17.0",
    "grpcio>=1.83.0,<2.0.0",
    "protobuf>=6.33.2,<8.0.0",
    "click>=8.4.2,<9.0.0",
    "httpx>=0.28.1,<0.29.0",
    "fake-useragent>=2.2.0,<3.0.0",
    "loguru>=0.7.3,<0.8.0",
    "python-box[all]>=7.4.1,<8.0.0",
    "uuid-utils>=0.17.0,<0.18.0",
    "typing-extensions>=4.15.0,<5.0.0",
]

[project.urls]
"Homepage" = "https://github.com/yuanqimanong/IPClick"
"Repository" = "https://github.com/yuanqimanong/IPClick"
"Bug Tracker" = "https://github.com/yuanqimanong/IPClick/issues"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "basedpyright>=1.37.1",
    "grpcio-tools>=1.83.0,<2.0.0",
    "ruff>=0.16.1",
    "twine>=6.2.0,<7.0.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
]

[project.scripts]
ipclick = "ipclick.__main__:main"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "network: 需要真实网络访问的测试（默认不运行：-m 'not network'）",
]


[tool.pyright]
include = ["src"]
exclude = [
    "**/__pycache__",
    ".venv",
    ".pytest_cache",
    "**/dto/proto/*.py",
    "**/dto/proto/*_pb2*.py",
    "**/dto/proto/*.pyi",
    "**/generated/**"
]
pythonVersion = "3.11"
reportAny = false
reportExplicitAny = false
reportUnknownMemberType = "none"

[tool.ruff]
# 代码格式化
line-length = 120
indent-width = 4
target-version = "py311"
# 生成的 protobuf 代码不参与 lint / format
extend-exclude = ["src/ipclick/dto/proto/task_pb2*.py", "src/ipclick/dto/proto/*_pb2_grpc.py"]

[tool.ruff.format]
# 格式化特定配置
quote-style = "double"
skip-magic-trailing-comma = false
indent-style = "space"

[tool.ruff.lint]
# 选择检查规则
select = [
    "E", # pycodestyle 错误
    "W", # pycodestyle 警告
    "F", # Pyflakes - 包含 F401
    "I", # isort - 导入排序
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "TID", # flake8-tidy-imports
    "SIM", # flake8-simplify
    "RUF", # ruff 自有规则
]

# 忽略的规则
ignore = [
    "E501", # 行长度由 formatter 负责
    "B008", # 允许在默认参数中调用函数
    # 本项目注释与文档字符串使用中文，全角标点是正常写法而非"易混淆字符"
    "RUF001", # 字符串中的全角标点
    "RUF002", # 文档字符串中的全角标点
    "RUF003", # 注释中的全角标点
]

# 只允许自动修复导入类问题，其余需人工确认
fixable = ["F401", "I001", "UP", "C4", "SIM", "RUF"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# 特定文件的忽略规则
"__init__.py" = ["F401"]  # 未使用的导入
"tests/**/*.py" = ["F401"]
"test_*.py" = ["F401"]

[tool.ruff.lint.isort]
# 导入排序配置
known-first-party = ["ipclick"]
lines-after-imports = 2
force-sort-within-sections = true
