[project]
name = "ipclick"
version = "1.0.0"
description = "IPClick Tool"
authors = [
    { name = "元气码农少女酱", email = "1276162429@qq.com" }
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["http", "grpc", "downloader", "scraping", "browser", "cluster"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "curl-cffi>=0.16.0,<0.17.0",
    "grpcio>=1.83.0,<2.0.0",
    "grpcio-health-checking>=1.83.0,<2.0.0",
    # 下限必须 >= 生成代码的 gencode 版本：src/ipclick/dto/proto/task_pb2.py 里
    # 有 ValidateProtobufRuntimeVersion(..., 7, 35, 1) 的硬校验，运行时低于它
    # 就直接 import 失败。实际上 grpcio-health-checking 也顶着同一个下限，
    # 所以写 6.33.2 装不出问题——但那是靠别人兜着，不是这里声明对了。
    "protobuf>=7.35.1,<8.0.0",
    "click>=8.4.2,<9.0.0",
    "fake-useragent>=2.2.0,<3.0.0",
    "loguru>=0.7.3,<0.8.0",
    "python-box[all]>=7.4.1,<8.0.0",
    "uuid-utils>=0.17.0,<0.18.0",
    "typing-extensions>=4.16.0,<5.0.0",
]

[project.optional-dependencies]
# HTTP 适配器。核心只带 curl_cffi（默认适配器，且是唯一有指纹伪装的）。
# 另一个可选的是 niquests —— requests 的 drop-in 替代，额外支持 HTTP/2 与 HTTP/3。
# （httpx 曾经也在这里，0.3.0 移除：它和 niquests 能力重叠，
#   而 niquests 还多支持 HTTP/3，维护两套等价的 HTTP 适配器不划算。）
niquests = ["niquests>=3.21.0,<4.0.0"]

# 浏览器渲染引擎。装完还要各自准备浏览器本体：
#   camoufox     python -m camoufox fetch
#   patchright   patchright install chromium
#   playwright   playwright install chromium
#   drissionpage 用本机已装的 Chrome/Chromium，无需下载
camoufox = ["camoufox>=0.5.4,<1.0.0"]
patchright = ["patchright>=1.61.2,<2.0.0"]
drissionpage = ["drissionpage>=4.1.1,<5.0.0"]
# camoufox 自己钉着 playwright<1.61，所以这两个 extra 真的互斥，
# 见 [tool.uv].conflicts —— 声明出来之后 uv 会为两者各解一份，
# 这里就不必为了迁就 camoufox 把上游最新的 playwright 挡在外面。
playwright = ["playwright>=1.62.0,<2.0.0"]

# 按平台打包好的组合。刻意不提供 [all]——把四个浏览器内核全装上去
# 有 70+ 个包和上 G 的浏览器本体，而一台机器只会用其中一个。
# curl_cffi 是核心依赖，不在这里重复声明（重复写还会引入版本区间打架的风险）。
#   win   : DrissionPage 直接驱动本机已装的 Chrome，Windows 上最省事
#   linux : Camoufox / Patchright 自带无头浏览器，适合服务器
# 用自引用而不是抄一遍版本区间：版本只在上面声明一次，改的时候不会漏。
win = ["ipclick[drissionpage]"]
linux = ["ipclick[camoufox,patchright]"]

[project.urls]
"Homepage" = "https://github.com/yuanqimanong/IPClick"
"Repository" = "https://github.com/yuanqimanong/IPClick"
"Bug Tracker" = "https://github.com/yuanqimanong/IPClick/issues"

[project.scripts]
ipclick = "ipclick.__main__:main"


[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"


# ---------------------------------------------------------------------------- #
# uv
# ---------------------------------------------------------------------------- #
[tool.uv]
required-version = ">=0.9.18"
default-groups = ["dev"]
# camoufox 钉着 playwright<1.61。声明成互斥之后 uv 会为两个 extra 各解一份依赖，
# [playwright] 才能跟上上游版本。代价是 `--all-extras` 不再可用（它会同时点亮
# 这两个互斥 extra），CI 里改成逐个 --extra 列出。
conflicts = [
    [{ extra = "camoufox" }, { extra = "playwright" }],
    [{ extra = "linux" }, { extra = "playwright" }],
]

[tool.uv.build-backend]
module-name = "ipclick"
module-root = "src"

[dependency-groups]
# 按用途分组，让每个 CI job 只装自己要的那份；dev 是给人用的聚合组。
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
]
lint = [
    "basedpyright>=1.39.9",
    "ruff>=0.16.1",
]
proto = [
    "grpcio-tools>=1.83.0,<2.0.0",
]
release = [
    "twine>=6.2.0,<7.0.0",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "proto" },
    { include-group = "release" },
]


# ---------------------------------------------------------------------------- #
# pytest
# ---------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "slow: 起真实 gRPC 端口的用例，比纯单元测试慢一个数量级",
]


# ---------------------------------------------------------------------------- #
# basedpyright
# ---------------------------------------------------------------------------- #
[tool.pyright]
include = ["src", "tests"]
exclude = [
    "**/__pycache__",
    ".venv",
    ".pytest_cache",
    "**/dto/proto/*.py",
    "**/dto/proto/*_pb2*.py",
    "**/dto/proto/*.pyi",
    "**/generated/**"
]
pythonVersion = "3.11"

# basedpyright 的退出码在有 warning 时也是 1，所以这里的取舍等同于 CI 门禁：
# 保留能抓到真问题的规则，关掉那些只因第三方库没有类型标注而必然触发的。
# curl_cffi / python-box / loguru / fake-useragent 都不发布完整类型信息，
# 追这几条规则到零只能靠满屏 cast，收益为负。
reportAny = false
reportExplicitAny = false
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
# 相邻字符串字面量隐式拼接：本项目用它拆长日志文案，属于有意为之
reportImplicitStringConcatenation = false
# 要求所有未被消费的返回值写成 `_ = ...`，噪音大于收益
reportUnusedCallResult = false
reportIncompatibleMethodOverride = false
reportUnsafeMultipleInheritance = false
reportMissingSuperCall = false

# 测试要盯住内部协作者的行为（错误映射、请求参数拼装），碰私有成员是正当的。
[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = "none"

[[tool.pyright.executionEnvironments]]
root = "src"


# ---------------------------------------------------------------------------- #
# ruff
# ---------------------------------------------------------------------------- #
[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py311"
# 生成的 protobuf 代码不参与 lint / format。
# 注意必须同时排除 .pyi：glob 的 "*_pb2*.py" 要求文件名以 .py 结尾，匹配不到
# task_pb2.pyi。漏掉它会让 ruff format 改写生成文件，之后每次重新生成都产生
# 差异，CI 的 "protobuf stubs are up to date" 检查就会一直失败。
extend-exclude = [
    "src/ipclick/dto/proto/*_pb2*.py",
    "src/ipclick/dto/proto/*_pb2*.pyi",
]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false
indent-style = "space"

[tool.ruff.lint]
select = [
    "E", # pycodestyle 错误
    "W", # pycodestyle 警告
    "F", # Pyflakes - 包含 F401
    "I", # isort - 导入排序
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "TID", # flake8-tidy-imports
    "SIM", # flake8-simplify
    "RUF", # ruff 自有规则
]

ignore = [
    "E501", # 行长度由 formatter 负责
    "B008", # 允许在默认参数中调用函数
    # 本项目注释与文档字符串使用中文，全角标点是正常写法而非"易混淆字符"
    "RUF001", # 字符串中的全角标点
    "RUF002", # 文档字符串中的全角标点
    "RUF003", # 注释中的全角标点
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["ipclick"]
lines-after-imports = 2
force-sort-within-sections = true
