[project]
name = "ipclick"
version = "0.2.3"
description = "IPClick Tool"
authors = [
    { name = "元气码农少女酱", email = "1276162429@qq.com" }
]
license = { text = "MIT License" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "curl-cffi>=0.16.0,<0.17.0",
    "grpcio>=1.83.0,<2.0.0",
    "grpcio-health-checking>=1.83.0,<2.0.0",
    "protobuf>=6.33.2,<8.0.0",
    "click>=8.4.2,<9.0.0",
    "httpx>=0.28.1,<0.29.0",
    "fake-useragent>=2.2.0,<3.0.0",
    "loguru>=0.7.3,<0.8.0",
    "python-box[all]>=7.4.1,<8.0.0",
    "uuid-utils>=0.17.0,<0.18.0",
    "typing-extensions>=4.15.0,<5.0.0",
]

[project.optional-dependencies]
# Prometheus 指标为可选：未安装时所有埋点降级为无操作，功能不受影响。
# 安装：pip install "ipclick[metrics]"
metrics = ["prometheus-client>=0.26.0,<1.0.0"]
# requests 适配器：非核心能力（无指纹伪装、无 HTTP/2），按需安装
requests = ["requests>=2.32.0,<3.0.0"]
# playwright 浏览器渲染适配器：装完还要 `playwright install chromium`
# （或把 [BROWSER].executable_path 指向系统已有的浏览器）
browser = ["playwright>=1.49.0,<2.0.0"]
# 浏览器渲染引擎，装完还要各自准备浏览器本体：
#   camoufox     python -m camoufox fetch
#   patchright   patchright install chromium
#   drissionpage 用本机已装的 Chrome/Chromium，无需下载
camoufox = ["camoufox>=0.5.0,<1.0.0"]
patchright = ["patchright>=1.52.0,<2.0.0"]
drissionpage = ["drissionpage>=4.1.0,<5.0.0"]
all = [
    "prometheus-client>=0.26.0,<1.0.0",
    "requests>=2.32.0,<3.0.0",
    "playwright>=1.49.0,<2.0.0",
    "camoufox>=0.5.0,<1.0.0",
    "patchright>=1.52.0,<2.0.0",
    "drissionpage>=4.1.0,<5.0.0",
]

[project.urls]
"Homepage" = "https://github.com/yuanqimanong/IPClick"
"Repository" = "https://github.com/yuanqimanong/IPClick"
"Bug Tracker" = "https://github.com/yuanqimanong/IPClick/issues"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "basedpyright>=1.37.1",
    "grpcio-tools>=1.83.0,<2.0.0",
    "ruff>=0.16.1",
    "twine>=6.2.0,<7.0.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=1.0.0",
]

[project.scripts]
ipclick = "ipclick.__main__:main"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "network: 需要真实网络访问的测试（默认不运行：-m 'not network'）",
]
# 异步测试无需逐个加 @pytest.mark.asyncio
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"


[tool.pyright]
include = ["src"]
exclude = [
    "**/__pycache__",
    ".venv",
    ".pytest_cache",
    "**/dto/proto/*.py",
    "**/dto/proto/*_pb2*.py",
    "**/dto/proto/*.pyi",
    "**/generated/**"
]
pythonVersion = "3.11"

# basedpyright 的退出码在有 warning 时也是 1，所以这里的取舍等同于 CI 门禁：
# 保留能抓到真问题的规则，关掉那些只因第三方库没有类型标注而必然触发的。
# curl_cffi / python-box / loguru / fake-useragent 都不发布完整类型信息，
# 追这几条规则到零只能靠满屏 cast，收益为负。
reportAny = false
reportExplicitAny = false
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
# 相邻字符串字面量隐式拼接：本项目用它拆长日志文案，属于有意为之
reportImplicitStringConcatenation = false
# 要求所有未被消费的返回值写成 `_ = ...`，噪音大于收益
reportUnusedCallResult = false

[tool.ruff]
# 代码格式化
line-length = 120
indent-width = 4
target-version = "py311"
# 生成的 protobuf 代码不参与 lint / format。
# 注意必须同时排除 .pyi：glob 的 "*_pb2*.py" 要求文件名以 .py 结尾，匹配不到
# task_pb2.pyi。漏掉它会让 ruff format 改写生成文件，之后每次重新生成都产生
# 差异，CI 的 "protobuf stubs are up to date" 检查就会一直失败。
extend-exclude = [
    "src/ipclick/dto/proto/*_pb2*.py",
    "src/ipclick/dto/proto/*_pb2*.pyi",
]

[tool.ruff.format]
# 格式化特定配置
quote-style = "double"
skip-magic-trailing-comma = false
indent-style = "space"

[tool.ruff.lint]
# 选择检查规则
select = [
    "E", # pycodestyle 错误
    "W", # pycodestyle 警告
    "F", # Pyflakes - 包含 F401
    "I", # isort - 导入排序
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "TID", # flake8-tidy-imports
    "SIM", # flake8-simplify
    "RUF", # ruff 自有规则
]

# 忽略的规则
ignore = [
    "E501", # 行长度由 formatter 负责
    "B008", # 允许在默认参数中调用函数
    # 本项目注释与文档字符串使用中文，全角标点是正常写法而非"易混淆字符"
    "RUF001", # 字符串中的全角标点
    "RUF002", # 文档字符串中的全角标点
    "RUF003", # 注释中的全角标点
]

# 只允许自动修复导入类问题，其余需人工确认
fixable = ["F401", "I001", "UP", "C4", "SIM", "RUF"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# 特定文件的忽略规则
"__init__.py" = ["F401"]  # 未使用的导入
"tests/**/*.py" = ["F401"]
"test_*.py" = ["F401"]

[tool.ruff.lint.isort]
# 导入排序配置
known-first-party = ["ipclick"]
lines-after-imports = 2
force-sort-within-sections = true
